
bundle:
  name: databricks_demo

include:
  - resources/*.yml

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-073a66fc-5c00.cloud.databricks.com/
    variables:
      environment: dev

  prod:
    mode: production
    workspace:
      host: https://dbc-073a66fc-5c00.cloud.databricks.com/
    variables:
      environment: prod
	  
	  
